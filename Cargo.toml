[package]
name = "soulsucker"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
description = "A polished TUI album downloader: MusicBrainz + Soulseek FLAC"
license = "MIT"
default-run = "soulsucker"

[features]
# Build and statically link FFmpeg for self-contained release binaries.
ffmpeg-static = ["ffmpeg-next/build"]

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
directories = "6"
ffmpeg-next = { version = "8.1", default-features = false, features = [
    "codec",
    "filter",
    "format",
    "software-resampling",
] }
lofty = "0.25"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soulseek-rs-lib = "20"
strsim = "0.11"
toml = "1"
unicode-normalization = "0.1"
unicode-width = "0.2"
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 1
