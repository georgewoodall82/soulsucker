name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-26
            target: aarch64-apple-darwin
          - os: macos-26-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install FFmpeg build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm libclang-dev

      - name: Install FFmpeg build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm

      - name: Install FFmpeg build tools (Windows)
        if: runner.os == 'Windows'
        run: choco install nasm make llvm -y --no-progress

      - name: Point bindgen at libclang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --features ffmpeg-static

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/pkg
          cp "target/${{ matrix.target }}/release/soulsucker" dist/pkg/
          cp README.md LICENSE dist/pkg/
          cp "target/${{ matrix.target }}/release/soulsucker" "dist/soulsucker-${GITHUB_REF_NAME}-${{ matrix.target }}"
          tar -czf "dist/soulsucker-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" -C dist/pkg .
          rm -rf dist/pkg

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/pkg | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/soulsucker.exe" dist/pkg/
          Copy-Item README.md, LICENSE dist/pkg/
          Copy-Item "target/${{ matrix.target }}/release/soulsucker.exe" "dist/soulsucker-${env:GITHUB_REF_NAME}-${{ matrix.target }}.exe"
          Compress-Archive -Path dist/pkg/* -DestinationPath "dist/soulsucker-${env:GITHUB_REF_NAME}-${{ matrix.target }}.zip"
          Remove-Item -Recurse -Force dist/pkg

      - uses: actions/upload-artifact@v7
        with:
          name: soulsucker-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
