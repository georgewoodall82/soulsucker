[project]
name = "soulsucker"
version = "0.1.0"
description = "Awesome terminal music downloader: MusicBrainz + Soulseek (aioslsk) FLAC album fetcher with Textual live UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aioslsk>=1.6.0",
    "musicbrainzngs>=0.7",
    "mutagen>=1.45",
    "textual>=0.80",
    "rich>=13.0",
]

[project.scripts]
soulsucker = "soulsucker.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["soulsucker*"]
